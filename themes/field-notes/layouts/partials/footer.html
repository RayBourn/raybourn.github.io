<footer class="site" data-pagefind-ignore>
  <div class="wrap">
    <div class="foot-grid">
      <div>
        <div class="foot-logo">{{ site.Title }}.</div>
        <p class="foot-tag">{{ site.Params.footer_tagline | default site.Params.description }}</p>
      </div>
      <div class="foot-col">
        <h4>Browse</h4>
        <a href="{{ "/issue/" | relLangURL }}">Issue</a>
        <a href="{{ "/life/" | relLangURL }}">Life</a>
        <a href="{{ "/nature/" | relLangURL }}">Nature</a>
        <a href="{{ "/science/" | relLangURL }}">Science</a>
        <a href="{{ "/tech/" | relLangURL }}">Tech</a>
        <a href="{{ "/books/" | relLangURL }}">Books</a>
      </div>
      <div class="foot-col">
        <h4>More</h4>
        <a href="{{ "/archive/" | relLangURL }}">Archive</a>
        <a href="{{ "/about/" | relLangURL }}">About</a>
        <a href="{{ "/contact/" | relLangURL }}">Contact</a>
      </div>
      <div class="foot-col">
        <h4>Links</h4>
        <a href="{{ "/index.xml" | relLangURL }}">RSS Feed</a>
        <a href="{{ "/privacy/" | relLangURL }}">Privacy Policy</a>
      </div>
    </div>
    <div class="foot-bottom">
      <span>{{ site.Params.copyright }}</span>
      <span>built with ♥️</span>
    </div>
  </div>
</footer>
