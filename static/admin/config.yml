backend:
  name: github
  repo: RayBourn/raybourn.github.io
  branch: main

media_folder: "assets/images"
public_folder: "images"

collections:
  # =========================
  # BOOKS
  # =========================
  - name: "books"
    label: "Books"
    label_singular: "Book"
    folder: "content/books"
    create: true
    slug: "{{slug}}"
    format: "yaml-frontmatter"

    fields:
      - { label: "Title", name: "title", widget: "string" }

      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          picker_utc: true,
        }

      - { label: "Draft", name: "draft", widget: "boolean", default: false }

      - {
          label: "Author",
          name: "authors",
          widget: "string",
          default: "Parminder S Rana",
        }

      - {
          label: "Book Author",
          name: "book_author",
          widget: "string",
          required: false,
        }

      - {
          label: "Categories",
          name: "categories",
          widget: "list",
          default: ["books"],
        }

      - { label: "Tags", name: "tags", widget: "list" }

      - {
          label: "Cover Image",
          name: "cover",
          widget: "image",
          required: false,
        }

      - { label: "Summary", name: "summary", widget: "text", required: false }

      - { label: "Body", name: "body", widget: "markdown" }

