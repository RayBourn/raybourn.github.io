backend:
  name: github
  repo: RayBourn/raybourn.github.io
  branch: main

media_folder: "assets/images"
public_folder: "images"

collections:
  # =========================
  # POSTS
  # =========================
  - name: "posts"
    label: "Posts"
    label_singular: "Post"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    format: "yaml-frontmatter"

    fields:
      - { label: "Title", name: "title", widget: "string" }

      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm:ss",
          picker_utc: true,
          default: "{{now}}",
        }

      - { label: "Draft", name: "draft", widget: "boolean", default: false }

      - {
          label: "Author",
          name: "authors",
          widget: "string",
          default: "Parminder S Rana",
        }

      - { label: "Tags", name: "tags", widget: "list" }

      - {
          label: "Cover Image",
          name: "cover",
          widget: "image",
          required: false,
        }

      - { label: "Summary", name: "summary", widget: "text", required: false }

      - { label: "Body", name: "body", widget: "markdown" }

  # =========================
  # BOOKS
  # =========================
  - name: "books"
    label: "Books"
    label_singular: "Book"
    folder: "content/books"
    create: true
    slug: "{{slug}}"
    format: "yaml-frontmatter"

    fields:
      - { label: "Title", name: "title", widget: "string" }

      - {
          label: "Publish Date",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DDTHH:mm:ssZ",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm:ss",
          picker_utc: true,
          default: "{{now}}",
        }

      - { label: "Draft", name: "draft", widget: "boolean", default: false }

      - {
          label: "Author",
          name: "authors",
          widget: "string",
          default: "Parminder S Rana",
        }

      - {
          label: "Book Author",
          name: "book_author",
          widget: "string",
          required: false,
        }

      - { label: "Tags", name: "tags", widget: "list" }

      - {
          label: "Cover Image",
          name: "cover",
          widget: "image",
          required: false,
        }

      - { label: "Summary", name: "summary", widget: "text", required: false }

      - { label: "Body", name: "body", widget: "markdown" }

  # =========================
  # PAGES
  # =========================
  - name: "pages"
    label: "Pages"

    files:
      # -------------------------
      # ABOUT
      # -------------------------
      - name: "about"
        label: "About Page"
        file: "content/about.md"
        format: "yaml-frontmatter"

        fields:
          - { label: "Title", name: "title", widget: "string" }

          - { label: "Draft", name: "draft", widget: "boolean", default: false }

          - {
              label: "Description",
              name: "description",
              widget: "text",
              required: false,
            }

          - { label: "Body", name: "body", widget: "markdown" }

      # -------------------------
      # CONTACT
      # -------------------------
      - name: "contact"
        label: "Contact Page"
        file: "content/contact.md"
        format: "yaml-frontmatter"

        fields:
          - { label: "Title", name: "title", widget: "string" }

          - {
              label: "Date",
              name: "date",
              widget: "datetime",
              picker_utc: true,
              default: "{{now}}",
            }

          - { label: "Draft", name: "draft", widget: "boolean", default: false }

          - {
              label: "Description",
              name: "description",
              widget: "text",
              required: false,
            }

          - { label: "Body", name: "body", widget: "markdown" }
