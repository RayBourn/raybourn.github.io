<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager | Field Notes</title>
  <script>
    // Polyfill crypto.randomUUID for non-secure HTTP contexts (e.g. local IP network testing)
    if (typeof window !== 'undefined') {
      if (!window.crypto) {
        window.crypto = {};
      }
      if (!window.crypto.randomUUID) {
        window.crypto.randomUUID = function getRandomUUID() {
          return ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, function (c) {
            var r = (window.crypto.getRandomValues ? window.crypto.getRandomValues(new Uint8Array(1))[0] : Math.floor(Math.random() * 16));
            return (c ^ (r & (15 >> (c / 4)))).toString(16);
          });
        };
      }
    }
  </script>
</head>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
