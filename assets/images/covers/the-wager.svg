<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <rect width="400" height="600" fill="#122230"/>
  <rect x="15" y="15" width="370" height="570" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  
  <text x="200" y="65" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#D4AF37" text-anchor="middle" letter-spacing="3">BY THE AUTHOR OF KILLERS OF THE FLOWER MOON</text>
  <text x="200" y="135" font-family="'Fraunces', serif" font-size="44" font-weight="700" fill="#F8F5EE" text-anchor="middle" letter-spacing="3">THE WAGER</text>
  
  <text x="200" y="175" font-family="'Fraunces', serif" font-size="15" font-style="italic" fill="#D4AF37" text-anchor="middle">A Tale of Shipwreck, Mutiny and Murder</text>
  
  <!-- 18th Century Tall Ship Graphic -->
  <g transform="translate(200, 330) scale(1.1)" stroke="#D4AF37" stroke-width="1.5" fill="none">
    <!-- Ship Hull -->
    <path d="M-50,40 C-30,55 30,55 50,40 C40,25 -40,25 -50,40 Z" fill="#D4AF37"/>
    <!-- Masts -->
    <line x1="-20" y1="25" x2="-20" y2="-60"/>
    <line x1="10" y1="25" x2="10" y2="-75"/>
    <line x1="35" y1="25" x2="35" y2="-45"/>
    <!-- Sails -->
    <path d="M-20,-50 C-5,-45 -5,-25 -20,-20 Z" fill="#F8F5EE" opacity="0.9"/>
    <path d="M10,-65 C28,-60 28,-35 10,-30 Z" fill="#F8F5EE" opacity="0.9"/>
    <path d="M10,-25 C25,-20 25,-5 10,0 Z" fill="#F8F5EE" opacity="0.9"/>
    <path d="M35,-35 C48,-30 48,-15 35,-10 Z" fill="#F8F5EE" opacity="0.9"/>
    <!-- Storm Waves -->
    <path d="M-80,50 Q-40,30 0,50 T80,50" stroke="#F8F5EE" stroke-width="2"/>
    <path d="M-90,65 Q-45,45 0,65 T90,65" stroke="#D4AF37" stroke-width="1.5"/>
  </g>
  
  <text x="200" y="495" font-family="'Inter', sans-serif" font-size="12" fill="#D4AF37" text-anchor="middle" letter-spacing="2">#1 NEW YORK TIMES BESTSELLER</text>
  <text x="200" y="535" font-family="'Fraunces', serif" font-size="28" font-weight="600" fill="#F8F5EE" text-anchor="middle">David Grann</text>
</svg>
